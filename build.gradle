plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.90' apply false
    id "maven-publish"
}

allprojects {
    apply plugin: "java"

    version = "${rootProject.mod_version}+mc.${minecraft_version}-${project.name}"

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }

    java {
        withSourcesJar()
        targetCompatibility = JavaVersion.VERSION_21
        sourceCompatibility = JavaVersion.VERSION_21
    }

    afterEvaluate {
        tasks.withType(JavaCompile) {
            options.compilerArgs.addAll("-Xmaxerrs", "2000")
        }
    }
}

subprojects {
    repositories {
        mavenCentral()

        // mappings
        exclusiveContent {
            forRepository {
                maven { url = "https://maven.parchmentmc.org" }
            }
            filter {
                includeGroup "org.parchmentmc.data"
            }
        }
        exclusiveContent { // mappings
            forRepository {
                maven { url = "https://maven.quiltmc.org/repository/release" }
            }
            filter {
                includeGroup "org.quiltmc"
            }
        }

        exclusiveContent { // our repo
            forRepository {
                maven { url = "https://maven.realrobotix.me/master/" }
            }
            filter {
                includeGroup("com.rbasamoyai")
                includeGroup("com.copycatsplus")
            }
        }

        // Mod websites
        exclusiveContent {
            forRepository {
                maven { url = "https://cursemaven.com" }
            }
            filter {
                includeGroup("curse.maven")
            }
        }

        exclusiveContent {
            forRepository {
                maven { url = "https://api.modrinth.com/maven" }
            }
            filter {
                includeGroup("maven.modrinth")
            }
        }

        //maven("https://maven.shedaniel.me/")
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.tterrag.com/" }
        maven { url = "https://maven.createmod.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://mvn.devos.one/snapshots" }

        flatDir{
            dir("libs")
        }
    }
    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/cannoneers-of-create/createbigcannons")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
            maven {
                name = "realRobotixMaven"
                url = uri("https://maven.realrobotix.me/createbigcannons")
                credentials(PasswordCredentials)
            }
            mavenLocal()
        }
    }
}
