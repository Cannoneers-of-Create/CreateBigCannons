	runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neoforge_version}")
	implementation("com.tterrag.registrate:Registrate:${registrate_neoforge_version}")

	// Development QOL
	runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

	// if you would like to add integration with JEI, uncomment this line.
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")

	//implementation("curse.maven:spark-361579:${spark_forge_file}") // Spark

	// Ritchie's Projectile Library
    String rplSuffix = Boolean.valueOf(use_rpl_nightly) ? "-build.${rpl_build}" : ""
	implementation("com.rbasamoyai:ritchiesprojectilelib:${rpl_version}+mc.${minecraft_version}-neoforge$rplSuffix") { transitive = false }
	// Create: Unify
	// implementation("maven.modrinth:create-unify:${mod.dep("unify_forge_file")}") fixme

	// Fixes, integration
	//implementation("com.copycatsplus:copycats:${copycats_version}+mc.${minecraft_version}-neoforge") { transitive = false }
    implementation("maven.modrinth:framedblocks:${framedblocks_version}")

	// Curios
	runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")
	compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api")

