plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev"
	id "maven-publish"
}

var ci = System.getenv("CI")?.toBoolean() ?: false
var release = System.getenv("RELEASE")?.toBoolean() ?: false
var nightly = ci && !release
var buildNumber = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull()
version = "${mod_version}${if (release) "" else "-dev"}+mc.${minecraft_version}-neoforge${if (nightly) "-build.${buildNumber}" else ""}"
group = "${group}.neoforge"
base.archivesName = mod_id

